<div class="bureau" [class.livre-ferme]="couvertureVisible()">
  <div class="livre" [class.derniere-page]="estDernierePage()">
    <!-- Couverture rigide en cuir, avec le dos relié à gauche -->
    <div class="couverture" aria-hidden="true"></div>

    <!-- Tranche : les pages restantes, de moins en moins nombreuses -->
    <div class="tranche" aria-hidden="true" [style.box-shadow]="tranche()"></div>

    <!-- La feuille courante : c'est elle qui se tourne -->
    <div class="feuille">
      <header class="titre-courant">{{ titreCourant() }}</header>

      <main class="contenu-feuille">
        <router-outlet />
      </main>

      <footer class="folio">
        <span class="folio-numero">{{ numeroDePage() }}</span>
        <span class="folio-total">page {{ numeroDePage() }} sur {{ total }}</span>
      </footer>
    </div>

    <!-- Couverture avant : le livre est fermé à l'arrivée, puis s'ouvre sur le sommaire -->
    @if (couvertureVisible()) {
      <div
        class="couverture-avant"
        [class.ouverture]="etatCouverture() === 'ouverture'"
        (animationend)="couvertureOuverte($event)"
      >
        <button
          type="button"
          class="couverture-battant"
          aria-label="Ouvrir le livre : Portfolio de Randy"
          (click)="ouvrirLeLivre()"
        >
          <span class="face-avant">
            <span class="cadre-dore">
              <span class="contenu-couverture">
              <span class="titre-dore">Portfolio<span class="titre-de">de</span>Randy</span>
              <span class="filet-dore" aria-hidden="true"></span>
              <span class="sous-titre-dore">Développeur full stack</span>
              </span>
            </span>
          </span>
          <span class="face-arriere" aria-hidden="true"></span>
        </button>
      </div>
    }
  </div>
</div>
